# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  auto_review:
    # Automatic review on every PR is off. Flip back to true to re-enable it;
    # an on-demand review can still be requested with "@coderabbitai review".
    enabled: false
    base_branches:
      - "develop"