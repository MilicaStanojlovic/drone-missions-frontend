@if (open) {
  <div class="cd" (click)="cancel.emit()">
    <div
      class="cd__card"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="title"
      (click)="$event.stopPropagation()"
    >
      <div class="cd__icon" [class.cd__icon--danger]="danger" aria-hidden="true">
        @if (danger) {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="13" /><line x1="12" y1="16" x2="12" y2="16" />
          </svg>
        }
      </div>

      <h2 class="cd__title">{{ title }}</h2>
      @if (message) {
        <p class="cd__message">{{ message }}</p>
      }

      <div class="cd__actions">
        <button type="button" class="cd__btn cd__btn--cancel" (click)="cancel.emit()">{{ cancelText }}</button>
        <button
          type="button"
          class="cd__btn"
          [class.cd__btn--danger]="danger"
          [class.cd__btn--primary]="!danger"
          (click)="confirm.emit()"
        >{{ confirmText }}</button>
      </div>
    </div>
  </div>
}
